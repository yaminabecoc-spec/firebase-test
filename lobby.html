<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<button id="startGame">
ゲーム開始
</button>

<button id="goGame">
抽選
</button>

<p id="status"></p>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem("roomId");

document.getElementById(
  "roomInfo"
).textContent =
  "ルームID : " + roomId;

async function loadPlayers(){

  try{

    const snapshot =
      await getDocs(

        collection(
          db,
          "rooms",
          roomId,
          "players"
        )

      );

    const list =
      document.getElementById(
        "playerList"
      );

    list.innerHTML = "";

    snapshot.forEach((player)=>{

      const data =
        player.data();

      const li =
        document.createElement("li");

      li.textContent =
        data.name || "(名前なし)";

      list.appendChild(li);

    });

  }
  catch(e){

    console.error(e);

    document
      .getElementById(
        "status"
      )
      .textContent =
      "参加者読込エラー";

  }

}

document
.getElementById(
  "startGame"
)
.addEventListener(
  "click",
  async ()=>{

    await setDoc(

      doc(
        db,
        "rooms",
        roomId,
        "gameData",
        "current"
      ),

      {
        started:true,
        test:"OK",
        createdAt:
          Date.now()
      }

    );

    document
    .getElementById(
      "status"
    )
    .textContent =
    "抽選完了";

  }

);

document
.getElementById(
  "goGame"
)
.addEventListener(
  ()=>{

    window.location.href =
      "game.html";

  }

);

loadPlayers();

</script>

</body>
</html>
