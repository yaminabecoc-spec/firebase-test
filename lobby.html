<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<button id="startGame">
ゲーム開始
</button>

<button id="goGame">
抽選
</button>

<p id="status"></p>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  getDocs,
  setDoc,
  collection
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem("roomId");

document
.getElementById("roomInfo")
.textContent =
"ルームID : " + roomId;

const words = [

  // 食べ物
  "ご飯",
  "パン",
  "ラーメン",

  // 飲み物
  "水",
  "お茶",
  "ジュース",

  // 果物
  "りんご",
  "みかん",
  "ぶどう",

  // 動物
  "犬",
  "猫",
  "うさぎ",

  // 鳥
  "すずめ",
  "はと",
  "からす",

  // 海の生き物
  "魚",
  "たこ",
  "くらげ",

  // 虫
  "ちょう",
  "かぶとむし",
  "あり",

  // 植物
  "花",
  "木",
  "草",

  // 自然
  "山",
  "川",
  "海",

  // 天気
  "雨",
  "雪",
  "風",

  // 天体
  "太陽",
  "月",
  "星",

  // 乗り物
  "車",
  "自転車",
  "電車",

  // 建物
  "学校",
  "病院",
  "図書館",

  // 家具
  "机",
  "椅子",
  "ベッド",

  // 文房具
  "鉛筆",
  "消しゴム",
  "ノート",

  // 電化製品
  "テレビ",
  "冷蔵庫",
  "洗濯機",

  // 衣類
  "帽子",
  "靴",
  "手袋",

  // スポーツ
  "野球",
  "サッカー",
  "テニス",

  // 楽器
  "ピアノ",
  "ギター",
  "太鼓",

  // 遊び
  "トランプ",
  "かくれんぼ",
  "将棋"

];

async function loadPlayers(){

  const list =
    document.getElementById(
      "playerList"
    );

  list.innerHTML = "";

  const snapshot =
    await getDocs(
      collection(
        db,
        "rooms",
        roomId,
        "players"
      )
    );

  snapshot.forEach((player)=>{

    const data =
      player.data();

    const li =
      document.createElement("li");

    li.textContent =
      data.name;

    list.appendChild(li);

  });

}

document
.getElementById("startGame")
.addEventListener(
  "click",
  async ()=>{

    const snapshot =
      await getDocs(
        collection(
          db,
          "rooms",
          roomId,
          "players"
        )
      );

    const players = [];

    snapshot.forEach((p)=>{

      players.push({
        id:p.id,
        ...p.data()
      });

    });

    if(players.length < 3){

      alert("3人以上必要です");
      return;

    }

    const shuffled =
      [...players]
      .sort(
        ()=>Math.random()-0.5
      );

    const leader =
      shuffled[0];

    const spy =
      shuffled[1];

    const roles = {};

    players.forEach((p)=>{

      roles[p.id] =
        "市民";

    });

    roles[leader.id] =
      "リーダー";

    roles[spy.id] =
      "スパイ";

    const word =
      words[
        Math.floor(
          Math.random()
          *
          words.length
        )
      ];

    await setDoc(

      doc(
        db,
        "rooms",
        roomId,
        "gameData",
        "current"
      ),

      {
        started:true,
        word:word,
        roles:roles,
        createdAt:Date.now()
      }

    );

    document
    .getElementById(
      "status"
    )
    .textContent =
      "抽選完了";

  }

);

document
.getElementById("goGame")
.addEventListener(
  "click",
  async ()=>{

    const gameRef =
      await getDoc(

        doc(
          db,
          "rooms",
          roomId,
          "gameData",
          "current"
        )

      );

    if(!gameRef.exists()){

      alert(
        "まだゲーム開始されていません"
      );

      return;

    }

    window.location.href =
      "game.html";

  }

);

loadPlayers();

</script>

</body>
</html>
