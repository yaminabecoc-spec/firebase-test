<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<button id="startGame">
ゲーム開始
</button>

<p id="status"></p>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem("roomId");

document
.getElementById("roomInfo")
.textContent =
"ルームID : " + roomId;

async function loadPlayers(){

 const list =
 document.getElementById(
  "playerList"
 );

 list.innerHTML = "";

 const snapshot =
 await getDocs(
  collection(
   db,
   "rooms",
   roomId,
   "players"
  )
 );

 snapshot.forEach((player)=>{

  const li =
    document.createElement("li");

  li.textContent =
    player.data().name;

  list.appendChild(li);

 });

}

document
.getElementById(
 "startGame"
)
.addEventListener(
 "click",
 ()=>{

  alert(
   "ゲーム開始ボタンは動作しています"
  );

});

loadPlayers();

</script>

</body>
</html>
