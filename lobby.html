<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<p id="debug"></p>

<button id="startGame">
ゲーム開始
</button>

<button id="goGame">
抽選
</button>

<script type="module">

import { db }
from "./common.js";

import {
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem("roomId");

document
.getElementById("roomInfo")
.textContent =
"ルームID : " + roomId;

try{

  const snapshot =
    await getDocs(

      collection(
        db,
        "rooms",
        roomId,
        "players"
      )

    );

  document
    .getElementById(
      "debug"
    )
    .textContent =
      "取得件数 : " +
      snapshot.size;

  const list =
    document
    .getElementById(
      "playerList"
    );

  snapshot.forEach((player)=>{

    const data =
      player.data();

    console.log(data);

    const li =
      document.createElement(
        "li"
      );

    li.textContent =
      JSON.stringify(data);

    list.appendChild(li);

  });

}
catch(e){

  document
    .getElementById(
      "debug"
    )
    .textContent =
      e.message;

}

document
.getElementById(
  "startGame"
)
.onclick = ()=>{

  alert(
    "OK"
  );

};

</script>

</body>
</html>
