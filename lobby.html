<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<button id="startGame" style="display:none">
ゲーム開始
</button>

<button id="goGame">
抽選
</button>

<p id="status"></p>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem("roomId");

const playerId =
  localStorage.getItem("playerId");

const words = [
  "単語1",
  "単語2",
  "単語3",
  "単語4",
  "単語5"
];

document.getElementById(
  "roomInfo"
).textContent =
  "ルームID : " + roomId;

async function loadPlayers(){

  const list =
    document.getElementById(
      "playerList"
    );

  list.innerHTML = "";

  const snapshot =
    await getDocs(
      collection(
        db,
        "rooms",
        roomId,
        "players"
      )
    );

  snapshot.forEach((player)=>{

    const li =
      document.createElement("li");

    li.textContent =
      player.data().name;

    list.appendChild(li);

  });

}

const roomRef =
await getDoc(
  doc(
    db,
    "rooms",
    roomId
  )
);

const roomData =
  roomRef.data();

if(
  roomData.masterId
  ===
  playerId
){

  document
    .getElementById(
      "startGame"
    )
    .style.display =
      "block";

}

document
.getElementById(
  "startGame"
)
.addEventListener(
  "click",
  async ()=>{

    try{

      const snapshot =
        await getDocs(
          collection(
            db,
            "rooms",
            roomId,
            "players"
          )
        );

      const players = [];

      snapshot.forEach((p)=>{

        players.push({
          id:p.id,
          ...p.data()
        });

      });

      if(players.length < 3){

        alert(
          "3人以上必要です"
        );

        return;

      }

      const shuffled =
        [...players]
        .sort(
          ()=>Math.random()-0.5
        );

      const leader =
        shuffled[0];

      const spy =
        shuffled[1];

      const word =
        words[
          Math.floor(
            Math.random() *
            words.length
          )
        ];

      const roles = {};

      players.forEach((p)=>{

        roles[p.id] =
          "市民";

      });

      roles[leader.id] =
        "リーダー";

      roles[spy.id] =
        "スパイ";

      await setDoc(

        doc(
          db,
          "rooms",
          roomId,
          "gameData",
          "current"
        ),

        {
          started:true,
          word:word,
          roles:roles,
          createdAt:
            Date.now()
        }

      );

      document
        .getElementById(
          "status"
        )
        .textContent =
        "ゲーム開始済み";

      alert(
        "ゲーム開始完了"
      );

    }
    catch(e){

      alert(
        e.message
      );

      console.error(e);

    }

});

.getElementById(
  "goGame"
)
.addEventListener(
  async ()=>{
