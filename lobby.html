<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<button id="startGame">
ゲーム開始
</button>

<button id="goGame">
抽選
</button>

<p id="status"></p>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem("roomId");

document
.getElementById("roomInfo")
.textContent =
"ルームID : " + roomId;

const words = [
  "単語1",
  "単語2",
  "単語3",
  "単語4",
  "単語5"
];

async function loadPlayers(){

  const snapshot =
    await getDocs(
      collection(
        db,
        "rooms",
        roomId,
        "players"
      )
    );

  const list =
    document.getElementById(
      "playerList"
    );

  list.innerHTML = "";

  snapshot.forEach((player)=>{

    const data =
      player.data();

    const li =
      document.createElement("li");

    li.textContent =
      data.name;

    list.appendChild(li);

  });

}

document
.getElementById(
  "startGame"
)
.addEventListener(
  "click",
  async ()=>{

    const snapshot =
      await getDocs(
        collection(
          db,
          "rooms",
          roomId,
          "players"
        )
      );

    const players = [];

    snapshot.forEach((p)=>{

      players.push({
        id:p.id,
        ...p.data()
      });

    });

    if(players.length < 3){

      alert(
        "3人以上必要です"
      );

      return;

    }

    const shuffled =
      [...players]
      .sort(
        ()=>Math.random()-0.5
      );

    const leader =
      shuffled[0];

    const spy =
      shuffled[1];

    const roles = {};

    players.forEach((p)=>{

      roles[p.id] =
        "市民";

    });

    roles[leader.id] =
      "リーダー";

    roles[spy.id] =
      "スパイ";

    const word =
      words[
        Math.floor(
          Math.random()
          *
          words.length
        )
      ];

    await setDoc(

      doc(
        db,
        "rooms",
        roomId,
        "gameData",
        "current"
      ),

      {
        started:true,
        word:word,
        roles:roles,
        createdAt:
          Date.now()
      }

    );

    document
    .getElementById(
      "status"
    )
    .textContent =
      "抽選完了";

    alert(
      "抽選完了"
    );

});

document
.getElementById(
  "goGame"
)
.addEventListener(
  async ()=>{

    const gameRef =
      await getDoc(
        doc(
          db,
          "rooms",
          roomId,
          "gameData",
          "current"
        )
      );

    if(
      !gameRef.exists()
    ){

      alert(
        "まだゲーム開始されていません"
      );

      return;

    }

    window.location.href =
      "game.html";

});

loadPlayers();

</script>

</body>
</html>
