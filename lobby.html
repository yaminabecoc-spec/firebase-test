<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>ロビー</title>
</head>

<body>

<h1>ロビー</h1>

<h2 id="roomInfo"></h2>

<h2>参加者一覧</h2>

<ul id="playerList"></ul>

<button
id="startGame"
style="display:none">

ゲーム開始

</button>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem(
    "roomId"
  );

const playerId =
  localStorage.getItem(
    "playerId"
  );

document
.getElementById(
  "roomInfo"
)
.textContent =
"ルームID : " + roomId;

async function loadPlayers(){

  const list =
    document
    .getElementById(
      "playerList"
    );

  list.innerHTML = "";

  const snapshot =
    await getDocs(
      collection(
        db,
        "rooms",
        roomId,
        "players"
      )
    );

  snapshot.forEach((player)=>{

    const li =
      document
      .createElement("li");

    li.textContent =
      player.data().name;

    list.appendChild(li);

  });

}

const roomData =
  await getDoc(
    doc(
      db,
      "rooms",
      roomId
    )
  );

if(roomData.exists()){

  const room =
    roomData.data();

  if(
    room.masterId
    ===
    playerId
  ){

    document
    .getElementById(
      "startGame"
    )
    .style.display =
      "block";

  }

}

loadPlayers();

</script>

</body>
</html>
