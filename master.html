<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>マスターページ</title>
</head>

<body>

<h1>マスターページ</h1>

<button id="createRoom">
ルーム作成
</button>

<h2 id="roomDisplay">
未作成
</h2>

<button id="next" disabled>
参加ページへ
</button>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  setDoc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

async function createUniqueRoomId(){

  while(true){

    const roomId =
      String(
        Math.floor(
          1000 +
          Math.random() * 9000
        )
      );

    const roomRef =
      await getDoc(
        doc(
          db,
          "rooms",
          roomId
        )
      );

    if(!roomRef.exists()){

      return roomId;

    }

  }

}

document
.getElementById("createRoom")
.addEventListener("click",
async ()=>{

  const roomId =
    await createUniqueRoomId();

  const playerId =
    localStorage.getItem(
      "playerId"
    );

  await setDoc(
    doc(
      db,
      "rooms",
      roomId
    ),
    {
      roomId: roomId,
      created: true,
      started: false,
      masterId: playerId,
      createdAt: Date.now()
    }
  );

  localStorage.setItem(
    "roomId",
    roomId
  );

  document
    .getElementById(
      "roomDisplay"
    )
    .textContent =
    "ルームID : " + roomId;

  document
    .getElementById(
      "next"
    )
    .disabled = false;

});

document
.getElementById("next")
.addEventListener("click",()=>{

  window.location.href =
    "join.html";

});

</script>

</body>
</html>
