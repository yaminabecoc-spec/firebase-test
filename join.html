<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>参加ページ</title>
</head>

<body>

<h1>参加ページ</h1>

<h2 id="roomInfo">
ルーム
</h2>

<input
id="playerName"
placeholder="名前">

<button id="registerBtn">
登録
</button>

<h2>参加者一覧</h2>

<ul id="playerList">
</ul>

<button
id="startGame"
style="display:none;">

ゲーム開始

</button>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem(
    "roomId"
  );

const playerId =
  localStorage.getItem(
    "playerId"
  );

document
.getElementById(
  "roomInfo"
)
.textContent =
"ルームID : " + roomId;

async function loadPlayers(){

  const list =
    document
    .getElementById(
      "playerList"
    );

  list.innerHTML = "";

  const snapshot =
    await getDocs(
      collection(
        db,
        "rooms",
        roomId,
        "players"
      )
    );

  snapshot.forEach((player)=>{

    const li =
      document
      .createElement("li");

    li.textContent =
      player.data().name;

    list.appendChild(li);

  });

}

document
.getElementById(
  "registerBtn"
)
.addEventListener(
  "click",
  async ()=>{

    const name =
      document
      .getElementById(
        "playerName"
      )
      .value;

    if(!name){
      return;
    }

    localStorage.setItem(
      "playerName",
      name
    );

    await setDoc(

      doc(
        db,
        "rooms",
        roomId,
        "players",
        playerId
      ),

      {
        id: playerId,
        name: name
      }

    );

    loadPlayers();

});

const roomData =
  await getDoc(
    doc(
      db,
      "rooms",
      roomId
    )
  );

if(
  roomData.exists()
){

  const room =
    roomData.data();

  if(
    room.masterId
    ===
    playerId
  ){

    document
    .getElementById(
      "startGame"
    )
    .style.display =
      "block";

  }

}

loadPlayers();

</script>

</body>
</html>
