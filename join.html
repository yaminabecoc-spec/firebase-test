<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>名前登録</title>
</head>

<body>

<h1>名前登録</h1>

<h2 id="roomInfo"></h2>

<input
id="playerName"
placeholder="名前">

<button id="registerBtn">
登録
</button>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem(
    "roomId"
  );

const playerId =
  localStorage.getItem(
    "playerId"
  );

document
.getElementById(
  "roomInfo"
)
.textContent =
"ルームID : " + roomId;

document
.getElementById(
  "registerBtn"
)
.addEventListener(
  "click",
  async ()=>{

    const name =
      document
      .getElementById(
        "playerName"
      )
      .value
      .trim();

    if(!name){

      alert(
        "名前を入力してください"
      );

      return;

    }

    localStorage.setItem(
      "playerName",
      name
    );

    await setDoc(

      doc(
        db,
        "rooms",
        roomId,
        "players",
        playerId
      ),

      {
        id: playerId,
        name: name
      }

    );

    window.location.href =
      "lobby.html";

});

</script>

</body>
</html>
