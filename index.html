<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebaseテスト</title>
</head>

<body>

<h1>Firebaseテスト</h1>

<p>名前</p>
<input id="name" placeholder="名前">

<p>キーワード</p>
<input id="word" placeholder="キーワード">

<br><br>

<button id="saveBtn">
登録
</button>

<h2>あなたの情報</h2>

<p id="myInfo">
未登録
</p>

<h2>登録済み</h2>

<ul id="list"></ul>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXG-VEW0ev4lqNtywdkMxzwWf8CEQ2M-c",
  authDomain: "yaminabe-f4c7d.firebaseapp.com",
  projectId: "yaminabe-f4c7d",
  storageBucket: "yaminabe-f4c7d.firebasestorage.app",
  messagingSenderId: "570479773819",
  appId: "1:570479773819:web:4a4b49f453f3ba9b77fade"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const savedName =
  localStorage.getItem("playerName");

const savedWord =
  localStorage.getItem("playerWord");

if(savedName && savedWord){

  document.getElementById("myInfo")
    .textContent =
    "名前：" +
    savedName +
    "　キーワード：" +
    savedWord;

}

async function loadData(){

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  const snapshot =
    await getDocs(
      collection(db,"players")
    );

  snapshot.forEach((doc)=>{

    const data = doc.data();

    const li =
      document.createElement("li");

    li.textContent =
      data.name +
      " ： " +
      data.word;

    list.appendChild(li);

  });
}

document
.getElementById("saveBtn")
.addEventListener("click", async ()=>{

  const name =
    document.getElementById("name").value;

  const word =
    document.getElementById("word").value;

  if(!name || !word){
    return;
  }

  await addDoc(
    collection(db,"players"),
    {
      name:name,
      word:word
    }
  );

  localStorage.setItem(
    "playerName",
    name
  );

  localStorage.setItem(
    "playerWord",
    word
  );

  document.getElementById("myInfo")
    .textContent =
    "名前：" +
    name +
    "　キーワード：" +
    word;

  document.getElementById("name").value="";
  document.getElementById("word").value="";

  loadData();

});

loadData();

</script>

</body>
</html>
