<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ログイン</title>
</head>

<body>

<h1>ゲームログイン</h1>

<h2>マスター</h2>

<input
 id="masterPassword"
 placeholder="パスワード">

<button id="masterLogin">
ログイン
</button>

<hr>

<h2>ゲスト</h2>

<input
 id="roomId"
 placeholder="4桁ID">

<button id="guestLogin">
参加
</button>

<script>

document
.getElementById("masterLogin")
.addEventListener("click",()=>{

  const password =
    document.getElementById(
      "masterPassword"
    ).value;

  if(password==="2417"){

    localStorage.setItem(
      "isMaster",
      "true"
    );

    window.location.href =
      "master.html";

  }

});

document
.getElementById("guestLogin")
.addEventListener("click",()=>{

  const roomId =
    document.getElementById(
      "roomId"
    ).value;

  localStorage.setItem(
    "roomId",
    roomId
  );

  window.location.href =
    "join.html";

});

</script>

</body>
</html>
