<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ログイン</title>
</head>

<body>

<h1>ログイン</h1>

<h2>マスター</h2>

<input
 id="masterPassword"
 placeholder="パスワード">

<button id="masterLogin">
ログイン
</button>

<hr>

<h2>ゲスト</h2>

<input
 id="roomId"
 placeholder="4桁ID">

<button id="guestLogin">
参加
</button>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

document
.getElementById("masterLogin")
.addEventListener("click",()=>{

  const password =
    document.getElementById(
      "masterPassword"
    ).value;

  if(password === "2417"){

    localStorage.setItem(
      "isMaster",
      "true"
    );

    window.location.href =
      "master.html";

  }

});

document
.getElementById("guestLogin")
.addEventListener("click",
async ()=>{

  const roomId =
    document
    .getElementById(
      "roomId"
    )
    .value
    .trim();

  if(roomId === ""){

    alert(
      "ルームIDを入力してください"
    );

    return;

  }

  const roomRef =
    await getDoc(
      doc(
        db,
        "rooms",
        roomId
      )
    );

  if(roomRef.exists()){

    localStorage.setItem(
      "roomId",
      roomId
    );

    window.location.href =
      "join.html";

  }
  else{

    alert(
      "そのルームは存在しません"
    );

  }

});

</script>

</body>
</html>
