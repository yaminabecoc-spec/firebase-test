<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランダム単語テスト</title>
</head>

<body>

<h1>ランダム単語テスト</h1>

<button id="randomBtn">
単語を選ぶ
</button>

<h2 id="result">
まだ選ばれていません
</h2>

<script>

const words = [
  "単語1",
  "単語2",
  "単語3",
  "単語4",
  "単語5"
];

document
.getElementById("randomBtn")
.addEventListener("click", () => {

  const index =
    Math.floor(
      Math.random() * words.length
    );

  document
    .getElementById("result")
    .textContent =
    words[index];

});

</script>

</body>
</html>
