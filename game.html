<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>結果表示</title>
</head>

<body>

<h1>あなたの役職</h1>

<h2 id="role">
読み込み中
</h2>

<h2 id="word"></h2>

<script type="module">

import { db }
from "./common.js";

import {
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const roomId =
  localStorage.getItem(
    "roomId"
  );

const playerId =
  localStorage.getItem(
    "playerId"
  );

const gameRef =
await getDoc(

  doc(
    db,
    "rooms",
    roomId,
    "gameData",
    "current"
  )

);

if(
  !gameRef.exists()
){

  document
  .getElementById(
    "role"
  )
  .textContent =
  "ゲーム未開始";

}
else{

  const game =
    gameRef.data();

  const role =
    game.roles[playerId];

  document
  .getElementById(
    "role"
  )
  .textContent =
  role;

  if(
    role === "リーダー"
    ||
    role === "スパイ"
  ){

    document
    .getElementById(
      "word"
    )
    .textContent =
    "単語 : "
    + game.word;

  }
  else{

    document
    .getElementById(
      "word"
    )
    .textContent =
    "単語は表示されません";

  }

}

</script>

</body>
</html>
